name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: yarn install --frozen-lockfile
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
        env:
          MOBIGPT_VERSION_CODE: ${{ github.run_number }}
          MOBIGPT_KEYSTORE_FILE: ${{ secrets.MOBIGPT_KEYSTORE_FILE }}
          MOBIGPT_KEYSTORE_PASSWORD: ${{ secrets.MOBIGPT_KEYSTORE_PASSWORD }}
          MOBIGPT_KEY_ALIAS: ${{ secrets.MOBIGPT_KEY_ALIAS }}
          MOBIGPT_KEY_PASSWORD: ${{ secrets.MOBIGPT_KEY_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "MobiGPT-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: MobiGPT-*.apk
          generate_release_notes: true
