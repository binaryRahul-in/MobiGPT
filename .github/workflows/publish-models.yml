name: Publish optimised voice models

# Builds MobiGPT's INT8 ContentVec (MatMul-only, per-channel, 7-bit range) from
# the FP32 upstream model, verifies parity on real speech and attaches it to the
# `models-v1` release that the app's catalogue points at.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which assets to (re)publish'
        type: choice
        options: [all, contentvec, tts]
        default: all

permissions:
  contents: write

jobs:
  contentvec-int8:
    if: inputs.only != 'tts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install numpy onnx onnxruntime==1.24.3 librosa soundfile huggingface_hub
      - name: Quantise + parity gate
        run: |
          mkdir -p out
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          shutil.copy(hf_hub_download("TigreGotico/voiceclonnx-rvc", "contentvec_768l12.onnx"), "out/contentvec_768l12.onnx")
          PY
          espeak-ng -v en-us -w out/speech.wav "Private artificial intelligence runs entirely on this phone. Nothing leaves the device."
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "tools/rvc")
          from quantize_rvc import load_audio, parity_encoder, quantize
          quantize("encoder", "out/contentvec_768l12.onnx", "out/contentvec_768l12_int8_pc.onnx", None, per_channel=True, reduce_range=True)
          p = parity_encoder("out/contentvec_768l12.onnx", "out/contentvec_768l12_int8_pc.onnx", load_audio("out/speech.wav"))
          p["mb"] = round(os.path.getsize("out/contentvec_768l12_int8_pc.onnx") / 1e6, 1)
          json.dump(p, open("out/contentvec_768l12_int8_pc.json", "w"), indent=2)
          print(json.dumps(p, indent=2))
          sys.exit(0 if p["pass"] else 1)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: MobiGPT voice models v1
          prerelease: true
          body: |
            Optimised ONNX models used by MobiGPT Voice Studio.
            * `contentvec_768l12_int8_pc.onnx` — ContentVec 768 (layer 12) INT8, MatMul-only, per-channel, reduce_range.
              Parity vs FP32 is in `contentvec_768l12_int8_pc.json`. Source: TigreGotico/voiceclonnx-rvc (MIT).
          files: |
            out/contentvec_768l12_int8_pc.onnx
            out/contentvec_768l12_int8_pc.json

  # Mirrors the neural TTS pack so the app has one pinned, reliable source:
  # Kokoro-82M v1.0 INT8 (Apache-2.0, ONNX export by thewh1teagle/kokoro-onnx, MIT),
  # seven English voices as raw N x 256 float32 styles, and misaki's US lexicons
  # (hexgrad/misaki 0.9.4, Apache-2.0) used by the app's G2P.
  kokoro-tts:
    if: inputs.only != 'contentvec'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy onnxruntime==1.24.3 misaki==0.9.4
      - name: Fetch and repackage
        run: |
          set -euo pipefail
          mkdir -p out
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL -o out/kokoro-v1.0.int8.onnx "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL -o voices.npz "$base/voices-v1.0.bin"
          python - <<'PY'
          import json, os, shutil, numpy as np, onnxruntime as ort, misaki
          s = ort.InferenceSession("out/kokoro-v1.0.int8.onnx")
          assert [i.name for i in s.get_inputs()] == ["tokens", "style", "speed"], s.get_inputs()
          v = np.load("voices.npz")
          for name in ["af_heart", "af_bella", "af_sarah", "am_michael", "am_fenrir", "bf_emma", "bm_george"]:
              a = v[name].reshape(-1, 256).astype("<f4")
              assert a.shape == (510, 256), a.shape
              a.tofile(f"out/kokoro_voice_{name}.bin")
          data = os.path.join(os.path.dirname(misaki.__file__), "data")
          for f in ["us_gold.json", "us_silver.json"]:
              json.load(open(os.path.join(data, f)))  # must parse
              shutil.copy(os.path.join(data, f), f"out/misaki_{f}")
          PY
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: MobiGPT voice models v1
          prerelease: true
          files: |
            out/kokoro-v1.0.int8.onnx
            out/kokoro_voice_*.bin
            out/misaki_us_gold.json
            out/misaki_us_silver.json
