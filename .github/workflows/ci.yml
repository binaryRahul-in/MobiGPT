name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly: re-validate the model catalog + real-model voice run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: 1.24.3

jobs:
  js:
    name: JS · typecheck, lint, unit + UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          RNLLAMA_SKIP_POSTINSTALL: '1'
      - run: yarn typecheck
      - run: yarn lint --max-warnings 0
      - run: npx prettier --check "src/**/*.{ts,tsx}" "packages/*/src/**/*.ts" "*.js"
      - run: yarn test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  native-core:
    name: C++ engine · ${{ matrix.os }}${{ matrix.sanitize && ' (ASan+UBSan)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ort: onnxruntime-linux-x64
          - os: ubuntu-latest
            ort: onnxruntime-linux-x64
            sanitize: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy onnx librosa
      - name: Download ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          set -o pipefail
          mkdir -p build/native
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort }}-${ORT_VERSION}.tgz" | tar xz -C build/native
          echo "ORT_ROOT=$PWD/build/native/${{ matrix.ort }}-${ORT_VERSION}" >> "$GITHUB_ENV"
      - name: Build + run tests
        run: bash scripts/test-native.sh
        env:
          SANITIZE: ${{ matrix.sanitize }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && !matrix.sanitize
        with:
          name: mobigpt-rvc-cli-linux
          path: build/native/build/mobigpt-rvc

  native-core-macos:
    name: C++ engine · macos-15
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy onnx librosa
      - run: bash scripts/test-native.sh

  rvc-real-models:
    name: RVC · real community models (Linux)
    needs: native-core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Depends on third-party Hugging Face repos staying online; a failure here
    # is reported in the job summary but does not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install numpy onnx onnxruntime==${ORT_VERSION} onnxconverter-common librosa soundfile huggingface_hub
      - name: Build engine CLI
        run: |
          set -o pipefail
          mkdir -p build/native
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar xz -C build/native
          ORT_ROOT=$PWD/build/native/onnxruntime-linux-x64-${ORT_VERSION}
          echo "LD_LIBRARY_PATH=$ORT_ROOT/lib" >> "$GITHUB_ENV"
          cmake -S packages/react-native-mobigpt-voice -B build/rvc -DORT_ROOT=$ORT_ROOT -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rvc -j4 --target mobigpt-rvc
      - name: Convert speech with real RVC models
        run: python tools/rvc/ci_real_models.py --cli build/rvc/mobigpt-rvc --out build/rvc-e2e
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - if: always()
        run: cat build/rvc-e2e/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-real-models
          path: |
            build/rvc-e2e/*.wav
            build/rvc-e2e/*.json
            build/rvc-e2e/report.md

  model-tools:
    name: Model tools · FP16 / INT8 conversion, .pth export and on-device import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy onnx onnxruntime==${ORT_VERSION} onnxconverter-common librosa
      - name: FP16 / INT8 conversion of every RVC layout
        run: python tools/rvc/test_quantize.py
      - name: Build engine CLI
        run: |
          set -o pipefail
          mkdir -p build/native
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar xz -C build/native
          ORT_ROOT=$PWD/build/native/onnxruntime-linux-x64-${ORT_VERSION}
          echo "LD_LIBRARY_PATH=$ORT_ROOT/lib" >> "$GITHUB_ENV"
          cmake -S packages/react-native-mobigpt-voice -B build/rvc -DORT_ROOT=$ORT_ROOT -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rvc -j4 --target mobigpt-rvc
      - name: Export a voice with the real RVC model code (FP32, --fp16) and import it as the app does (.zip -> template)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          git clone -q --filter=blob:none https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI build/rvc-src
          git -C build/rvc-src checkout -q 7ef1986
          python tools/rvc/ci_export_voice.py --rvc-repo build/rvc-src --out build/voice-export --cli build/rvc/mobigpt-rvc

  tts-real-model:
    name: TTS · Kokoro-82M through the app's G2P + engine, checked by ASR
    needs: native-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
        env:
          RNLLAMA_SKIP_POSTINSTALL: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy soundfile sherpa-onnx misaki==0.9.4
      - name: Build engine CLI
        run: |
          set -o pipefail
          mkdir -p build/native
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar xz -C build/native
          ORT_ROOT=$PWD/build/native/onnxruntime-linux-x64-${ORT_VERSION}
          echo "LD_LIBRARY_PATH=$ORT_ROOT/lib" >> "$GITHUB_ENV"
          cmake -S packages/react-native-mobigpt-voice -B build/rvc -DORT_ROOT=$ORT_ROOT -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rvc -j4 --target mobigpt-rvc
      - name: Fetch Kokoro-82M INT8, voices and a Moonshine ASR model
        run: |
          set -euo pipefail
          mkdir -p build/tts-models build/asr
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL -o build/tts-models/kokoro-v1.0.int8.onnx "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL -o build/tts-models/voices-v1.0.bin "$base/voices-v1.0.bin"
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-tiny-en-int8.tar.bz2 | tar xj -C build/asr
          echo "LEXICON_DIR=$(python -c 'import misaki, os; print(os.path.join(os.path.dirname(misaki.__file__), "data"))')" >> "$GITHUB_ENV"
      - name: Synthesise with the app's G2P + C++ engine, transcribe, gate on WER
        run: |
          npx tsc -p tools/tts/tsconfig.json
          python tools/tts/ci_tts.py --cli build/rvc/mobigpt-rvc --model build/tts-models/kokoro-v1.0.int8.onnx \
            --voices build/tts-models/voices-v1.0.bin --lexicon-dir "$LEXICON_DIR" --asr-dir build/asr --out build/tts-e2e
      - if: always()
        run: cat build/tts-e2e/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-real-model
          path: |
            build/tts-e2e/*.wav
            build/tts-e2e/*.json
            build/tts-e2e/report.md

  catalog:
    name: Catalog · Hugging Face files resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-catalog.js
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
