name: iOS

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build (Release)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: yarn install --frozen-lockfile
      - name: Pod install
        working-directory: ios
        run: bundle exec pod install
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace MobiGPT.xcworkspace -scheme MobiGPT -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tee xcodebuild.log | xcbeautify
      - name: Verify app bundle
        run: |
          APP=$(find ios/build/Build/Products -name "MobiGPT.app" -maxdepth 3 | head -1)
          ls -la "$APP"
          test -f "$APP/main.jsbundle"
          test -f "$APP/MaterialCommunityIcons.ttf"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
