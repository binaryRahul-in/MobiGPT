buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"

        // Build-time feature switches (see mobigpt.features.json).
        def features = new groovy.json.JsonSlurper().parse(file("$rootDir/../mobigpt.features.json"))
        MobiGPTVoice_ortVersion = features.voice?.ortVersion ?: "1.24.3"
        MobiGPTVoice_ortFlavor = System.getenv("MOBIGPT_ORT_FLAVOR") ?: (features.voice?.ortFlavor ?: "standard")
        ortVersion = MobiGPTVoice_ortVersion
        ortFlavor = MobiGPTVoice_ortFlavor
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
