def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def safeExt(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "ai.mobigpt.device"
  compileSdkVersion safeExt("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExt("minSdkVersion", 24)
    targetSdkVersion safeExt("targetSdkVersion", 36)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
}
