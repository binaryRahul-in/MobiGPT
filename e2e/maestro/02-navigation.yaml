appId: ai.mobigpt.app
name: 02-navigation
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 30000
- tapOn:
    id: "tab-device"
- extendedWaitUntil:
    visible:
      id: "device-ram"
    timeout: 20000
- assertVisible: "Accelerators"
- takeScreenshot: 02-device
- tapOn:
    id: "tab-models"
- scrollUntilVisible:
    element: "Qwen3 0.6B"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 02-models
- tapOn:
    id: "open-settings"
- extendedWaitUntil:
    visible:
      id: "open-about"
    timeout: 15000
- assertVisible: "Inference hardware"
- tapOn:
    id: "open-about"
- extendedWaitUntil:
    visible:
      id: "about-version"
    timeout: 15000
- takeScreenshot: 02-about
- back
- back
